<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coche8 — Alquiler y Venta a Plazos en Valencia</title>
<meta name="description" content="Alquiler de coches, motos y scooters en Valencia. Venta a plazos sin banco. Coche8.es">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#F97316;--orange-dark:#EA6A0A;--orange-light:#FFF4EC;--dark:#1A1A1A;--mid:#4B4B4B;--light:#F8F6F3;--white:#FFFFFF;--border:#E8E3DC;--radius:16px;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Manrope',sans-serif;background:var(--white);color:var(--dark);overflow-x:hidden;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;color:var(--dark);text-decoration:none;display:flex;align-items:center;gap:6px;}
.logo .eight{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--orange);color:white;border-radius:50%;font-size:20px;line-height:1;}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none;}
.nav-links a{text-decoration:none;color:var(--mid);font-size:15px;font-weight:500;transition:color .2s;}
.nav-links a:hover{color:var(--orange);}
.nav-right{display:flex;align-items:center;gap:12px;}
.lang-switcher{display:flex;gap:3px;background:var(--light);border-radius:8px;padding:3px;}
.lang-btn{border:none;background:transparent;cursor:pointer;padding:4px 9px;border-radius:5px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;color:var(--mid);transition:all .2s;}
.lang-btn.active{background:var(--orange);color:white;}
.cta-nav{background:var(--orange);color:white;border:none;cursor:pointer;padding:10px 18px;border-radius:10px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;text-decoration:none;transition:background .2s;white-space:nowrap;}
.cta-nav:hover{background:var(--orange-dark);}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;}
.burger span{display:block;width:24px;height:2px;background:var(--dark);border-radius:2px;}

/* HERO */
.hero{min-height:100vh;padding:120px 24px 80px;display:flex;align-items:center;background:var(--light);position:relative;overflow:hidden;}
.hero::before{content:'∞';position:absolute;right:-80px;top:50%;transform:translateY(-50%);font-size:580px;line-height:1;color:var(--orange);opacity:.055;font-family:'Outfit',sans-serif;pointer-events:none;user-select:none;}
.hero-inner{max-width:1200px;margin:0 auto;width:100%;position:relative;z-index:1;}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:var(--orange-light);border:1px solid #FED7AA;color:var(--orange-dark);border-radius:100px;padding:6px 16px;font-size:13px;font-weight:600;margin-bottom:28px;}
.hero-tag::before{content:'';width:8px;height:8px;background:var(--orange);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.4);}}
.hero h1{font-family:'Outfit',sans-serif;font-size:clamp(34px,4.5vw,58px);font-weight:700;line-height:1.15;color:var(--dark);margin-bottom:22px;max-width:800px;}
.hero h1 span{color:var(--orange);}
.hero-sub{font-size:clamp(15px,1.8vw,18px);color:var(--mid);max-width:540px;line-height:1.65;margin-bottom:40px;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;}
.btn-primary{background:var(--orange);color:white;padding:14px 28px;border-radius:12px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;text-decoration:none;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary:hover{background:var(--orange-dark);transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,115,22,.35);}
.btn-secondary{background:white;color:var(--dark);padding:14px 28px;border-radius:12px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;text-decoration:none;border:2px solid var(--border);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.btn-secondary:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-2px);}
.hero-stats{display:flex;gap:44px;margin-top:60px;flex-wrap:wrap;}
.stat-num{font-family:'Outfit',sans-serif;font-size:34px;font-weight:800;color:var(--dark);line-height:1;}
.stat-num span{color:var(--orange);}
.stat-label{font-size:13px;color:var(--mid);margin-top:4px;font-weight:500;}

/* SECTIONS */
section{padding:88px 24px;}
.section-inner{max-width:1200px;margin:0 auto;}
.section-tag{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--orange);margin-bottom:10px;}
.section-title{font-family:'Outfit',sans-serif;font-size:clamp(26px,3vw,40px);font-weight:700;line-height:1.15;color:var(--dark);margin-bottom:14px;}
.section-title span{color:var(--orange);}
.section-sub{font-size:16px;color:var(--mid);max-width:520px;line-height:1.7;margin-bottom:48px;}

/* PRODUCTS */
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.product-card{border-radius:22px;padding:44px;position:relative;overflow:hidden;transition:transform .3s;}
.product-card:hover{transform:translateY(-4px);}
.product-card.alquiler{background:var(--dark);color:white;}
.product-card.plazos{background:var(--orange-light);border:2px solid #FED7AA;}
.product-icon{font-size:44px;margin-bottom:20px;display:block;line-height:1;}
.product-card h3{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;margin-bottom:14px;}
.product-card.alquiler h3{color:white;}
.product-card.plazos h3{color:var(--dark);}
.product-card p{font-size:15px;line-height:1.7;margin-bottom:28px;}
.product-card.alquiler p{color:rgba(255,255,255,.72);}
.product-card.plazos p{color:var(--mid);}
.product-features{list-style:none;margin-bottom:36px;display:flex;flex-direction:column;gap:9px;}
.product-features li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;}
.product-card.alquiler .product-features li{color:rgba(255,255,255,.85);}
.product-card.plazos .product-features li{color:var(--dark);}
.feat-check{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.product-card.alquiler .feat-check{background:rgba(249,115,22,.3);color:var(--orange);}
.product-card.plazos .feat-check{background:var(--orange);color:white;}
.btn-card-dark{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:white;padding:13px 26px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;transition:all .2s;}
.btn-card-dark:hover{background:var(--orange-dark);}
.btn-card-light{display:inline-flex;align-items:center;gap:8px;background:var(--dark);color:white;padding:13px 26px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;transition:all .2s;}
.btn-card-light:hover{background:#333;}

/* CATALOG */
.catalog{background:var(--light);}
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px;}
.filter-tab{padding:8px 18px;border-radius:100px;border:2px solid var(--border);background:white;cursor:pointer;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;color:var(--mid);transition:all .2s;}
.filter-tab.active,.filter-tab:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-light);}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}
.car-card{background:white;border-radius:18px;overflow:hidden;border:1px solid var(--border);transition:all .3s;cursor:pointer;}
.car-card:hover{border-color:var(--orange);box-shadow:0 8px 28px rgba(249,115,22,.12);transform:translateY(-4px);}
.car-card.hidden{display:none;}
.car-img{height:170px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:76px;position:relative;}
.car-badge{position:absolute;top:10px;right:10px;background:var(--orange);color:white;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:100px;}
.car-badge.soon{background:var(--border);color:var(--mid);}
.car-info{padding:18px;}
.car-category{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);margin-bottom:5px;}
.car-name{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;color:var(--dark);margin-bottom:13px;line-height:1.2;}
.car-prices{display:flex;gap:10px;align-items:center;padding-top:13px;border-top:1px solid var(--border);}
.price-block{flex:1;}
.price-label{font-size:10px;color:var(--mid);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.price-val{font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;color:var(--dark);}
.price-val small{font-size:12px;font-weight:500;color:var(--mid);}
.price-divider{width:1px;height:34px;background:var(--border);}

/* HOW */
.how-tabs{display:flex;gap:8px;margin-bottom:44px;}
.how-tab{flex:1;padding:13px 18px;border-radius:11px;border:2px solid var(--border);background:white;cursor:pointer;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;color:var(--mid);transition:all .2s;text-align:center;}
.how-tab.active{border-color:var(--orange);color:var(--orange);background:var(--orange-light);}
.how-content{display:none;}
.how-content.active{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;}
.step-card{background:var(--light);border-radius:14px;padding:26px;position:relative;}
.step-num{font-family:'Outfit',sans-serif;font-size:44px;font-weight:800;color:var(--orange);opacity:.22;line-height:1;margin-bottom:6px;}
.step-icon{font-size:26px;margin-bottom:10px;}
.step-card h4{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;margin-bottom:7px;color:var(--dark);}
.step-card p{font-size:13px;color:var(--mid);line-height:1.6;}

/* WHY */
.why{background:var(--dark);}
.why .section-title{color:white;}
.why .section-sub{color:rgba(255,255,255,.6);}
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;}
.why-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px;transition:all .3s;}
.why-card:hover{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.3);transform:translateY(-4px);}
.why-icon{font-size:32px;margin-bottom:14px;display:block;}
.why-card h4{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;color:white;margin-bottom:9px;}
.why-card p{font-size:13px;color:rgba(255,255,255,.6);line-height:1.65;}

/* CONTACT */
.contact{background:var(--light);}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start;}
.contact-info h2{font-family:'Outfit',sans-serif;font-size:clamp(26px,3.5vw,40px);font-weight:700;color:var(--dark);margin-bottom:14px;line-height:1.15;}
.contact-info h2 span{color:var(--orange);}
.contact-info p{font-size:16px;color:var(--mid);line-height:1.7;margin-bottom:36px;}
.contact-btns{display:flex;flex-direction:column;gap:11px;}
.contact-btn{display:flex;align-items:center;gap:14px;padding:16px 22px;border-radius:13px;text-decoration:none;font-weight:700;font-size:15px;transition:all .2s;}
.contact-btn.whatsapp{background:#25D366;color:white;}
.contact-btn.whatsapp:hover{background:#1ebe5d;transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,211,102,.3);}
.contact-btn.telegram{background:#229ED9;color:white;}
.contact-btn.telegram:hover{background:#1a8fc4;transform:translateY(-2px);box-shadow:0 8px 20px rgba(34,158,217,.3);}
.contact-btn-icon{font-size:24px;}
.contact-btn-label{font-size:11px;font-weight:500;opacity:.8;}
.contact-btn-num{font-size:17px;}
.contact-card{background:white;border-radius:22px;padding:36px;border:1px solid var(--border);}
.contact-card h3{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;margin-bottom:22px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--mid);margin-bottom:5px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:9px;font-family:'Manrope',sans-serif;font-size:14px;color:var(--dark);background:var(--light);transition:border-color .2s;outline:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--orange);}
.form-group textarea{resize:vertical;min-height:80px;}
.form-submit{width:100%;padding:14px;background:var(--orange);color:white;border:none;border-radius:9px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;}
.form-submit:hover{background:var(--orange-dark);}

/* FOOTER */
footer{background:var(--dark);color:rgba(255,255,255,.5);padding:44px 24px;text-align:center;}
.footer-inner{max-width:1200px;margin:0 auto;}
.footer-logo{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:white;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;}
.footer-logo .eight{background:var(--orange);color:white;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;}
footer p{font-size:13px;margin-bottom:6px;}
footer a{color:var(--orange);text-decoration:none;}

/* MOBILE */
.mobile-menu{display:none;position:fixed;top:68px;left:0;right:0;background:white;border-bottom:1px solid var(--border);padding:22px;z-index:99;flex-direction:column;gap:14px;}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-size:16px;font-weight:600;color:var(--dark);text-decoration:none;padding:7px 0;border-bottom:1px solid var(--border);}

/* ANIMATIONS */
.fade-up{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease;}
.fade-up.visible{opacity:1;transform:translateY(0);}

@media(max-width:768px){
  .nav-links{display:none;}
  .burger{display:flex;}
  .products-grid{grid-template-columns:1fr;}
  .product-card{padding:30px;}
  .contact-grid{grid-template-columns:1fr;}
  .how-tabs{flex-direction:column;}
  .hero-stats{gap:28px;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="#" class="logo">Coche<span class="eight">8</span></a>

<!-- PRODUCTS -->

<section id="como-funciona">

      <div class="step-card"><div class="step-num">04</div><div class="step-icon">🚗</div><h4 data-i18n="alq_s4h"></h4><p data-i18n="alq_s4p"></p></div>

// ── STATE ──────────────────────────────────────────────────────────────────
let lang = 'es';
let catFilter = 'all';

// ── RENDER CATALOG ─────────────────────────────────────────────────────────
function renderCatalog(){
  const t = T[lang];
  // Filter tabs
  const tabs = [
    {key:'all',label:t.f_all},
    {key:'suv',label:t.f_suv},
    {key:'moto',label:t.f_moto},
    {key:'scooter',label:t.f_scooter},
    {key:'van',label:t.f_van},
  ];
  document.getElementById('filterTabs').innerHTML = tabs.map(tb=>
    `<button class="filter-tab${catFilter===tb.key?' active':''}" onclick="filterCars('${tb.key}')">${tb.label}</button>`
  ).join('');

  // Cards
  document.getElementById('catalogGrid').innerHTML = FLEET
    .filter(v => catFilter==='all' || v.cat===catFilter)
    .map(v=>`
      <div class="car-card fade-up">
        <div class="car-img">${v.emoji}
          <div class="car-badge${v.available?'':' soon'}">${v.available?t.badge_yes:t.badge_no}</div>
        </div>
        <div class="car-info">
          <div class="car-category">${v.catLabel[lang]}</div>
          <div class="car-name">${v.name}</div>
          <div class="car-prices">
            <div class="price-block">
              <div class="price-label">${t.lbl_rent}</div>
              <div class="price-val">€${v.rentDay}<small>/día</small></div>
            </div>
            <div class="price-divider"></div>
            <div class="price-block">
              <div class="price-label">${t.lbl_inst}</div>
              <div class="price-val">€${v.installMonth}<small>/mes</small></div>
            </div>
          </div>
        </div>
      </div>
    `).join('');

  // Re-observe new cards
  document.querySelectorAll('.fade-up').forEach(el=>observer.observe(el));
}

// ── APPLY TRANSLATIONS ─────────────────────────────────────────────────────
function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k]!==undefined) el.innerHTML = t[k];
  });
  renderCatalog();
}

function setLang(l){
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim().toLowerCase()===l ||
      (l==='zh' && b.textContent.trim()==='中文'));
  });
  applyLang();
}

function filterCars(cat){
  catFilter = cat;
  renderCatalog();
}

function switchHow(type,btn){
  document.querySelectorAll('.how-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.how-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('how-'+type).classList.add('active');
}

function toggleMenu(){
  document.getElementById('mobileMenu').classList.toggle('open');
}

function submitForm(){
  const name = document.getElementById('f_name').value||'';
  const phone = document.getElementById('f_phone').value||'';
  const interest = document.getElementById('f_interest').value||'';
  const msg = document.getElementById('f_msg').value||'';
  const text = `Hola! ${name}. Tel: ${phone}. Interés: ${interest}. ${msg}`;
  window.open('https://wa.me/34680273323?text='+encodeURIComponent(text),'_blank');
}

// ── SCROLL ANIMATIONS ──────────────────────────────────────────────────────
const observer = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
},{threshold:0.1});

document.querySelectorAll('.product-card,.step-card,.why-card').forEach(el=>{
  el.classList.add('fade-up');
  observer.observe(el);
});

// ── INIT ───────────────────────────────────────────────────────────────────
applyLang();
</script>
